
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar banco e APIs
        run: |
          python -c '
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:

              resposta = client.get("/")
              assert resposta.status_code == 200

              contato = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato de Teste",
                      "telefone": "73999990000",
                      "canal": "whatsapp",
                      "empresa_id": "empresa_teste",
                      "consentimento": False
                  }
              )

              assert contato.status_code == 200, contato.text
              contato_id = contato.json()["id"]

              consulta_contato = client.get(
                  "/contatos/",
                  params={"empresa_id": "empresa_teste"}
              )

              assert consulta_contato.status_code == 200
              assert any(
                  c["id"] == contato_id
                  for c in consulta_contato.json()
              )

              campanha = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": "empresa_teste",
                      "nome": "Campanha de Teste",
                      "mensagem": "Mensagem fictícia de teste.",
                      "canal": "whatsapp"
                  }
              )

              assert campanha.status_code == 200, campanha.text
              campanha_id = campanha.json()["id"]

              consulta_campanha = client.get(
                  "/campanhas/",
                  params={"empresa_id": "empresa_teste"}
              )

              assert consulta_campanha.status_code == 200
              assert any(
                  c["id"] == campanha_id
                  for c in consulta_campanha.json()
              )

              print("API INICIAL: OK")
              print("CADASTRO DE CONTATO: OK")
              print("CONSULTA DE CONTATO: OK")
              print("CRIACAO DE CAMPANHA: OK")
              print("CONSULTA DE CAMPANHA: OK")
              print("S.I.M.A.: TESTE COMPLETO APROVADO")
          '
