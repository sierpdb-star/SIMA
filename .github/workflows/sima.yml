
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar historico de campanhas
        run: |
          python -c '
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              empresa = "teste-etapa-26"

              contato = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato Autorizado",
                      "telefone": "5599111111111",
                      "canal": "whatsapp",
                      "empresa_id": empresa
                  }
              )
              assert contato.status_code == 200, contato.text
              contato_id = contato.json()["id"]

              autorizacao = client.post(
                  f"/contatos/{contato_id}/consentimento",
                  json={
                      "empresa_id": empresa,
                      "origem": "Teste ficticio"
                  }
              )
              assert autorizacao.status_code == 200, autorizacao.text

              campanha = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": empresa,
                      "nome": "Campanha Historico",
                      "mensagem": "Mensagem de teste",
                      "canal": "whatsapp"
                  }
              )
              assert campanha.status_code == 200, campanha.text
              campanha_id = campanha.json()["id"]

              preparacao = client.post(
                  f"/campanhas/{campanha_id}/preparar",
                  params={"empresa_id": empresa}
              )
              assert preparacao.status_code == 200, preparacao.text
              assert preparacao.json()["novos_registros"] == 1

              historico = client.get(
                  f"/campanhas/{campanha_id}/historico",
                  params={"empresa_id": empresa}
              )
              assert historico.status_code == 200, historico.text

              dados = historico.json()
              assert dados["total_registros"] == 1
              assert dados["historico"][0]["contato"] == "Contato Autorizado"
              assert dados["historico"][0]["status"] == "pending"
              assert dados["envios_automaticos"] is False

              print("CONTATO AUTORIZADO: OK")
              print("PREPARACAO DA CAMPANHA: OK")
              print("REGISTRO NO HISTORICO: OK")
              print("CONSULTA DO HISTORICO: OK")
              print("ENVIO AUTOMATICO: DESATIVADO")
              print("S.I.M.A.: HISTORICO APROVADO")
          '
