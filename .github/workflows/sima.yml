
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar banco e APIs
        run: |
          python -c '
          from fastapi.testclient import TestClient
          from sqlalchemy import inspect
          from app.main import app
          from app.database import engine

          with TestClient(app) as client:
              tabelas = set(inspect(engine).get_table_names())
              esperadas = {"contacts", "campaigns", "delivery_logs"}

              assert esperadas.issubset(tabelas), "Tabelas ausentes"

              resposta = client.get("/")
              assert resposta.status_code == 200

              empresa = "teste-sima"

              contato = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato de Teste",
                      "telefone": "5599999999999",
                      "canal": "whatsapp",
                      "empresa_id": empresa,
                      "consentimento": "false"
                  }
              )
              assert contato.status_code == 200, contato.text

              consulta = client.get(
                  "/contatos/",
                  params={"empresa_id": empresa}
              )
              assert consulta.status_code == 200
              assert len(consulta.json()) == 1

              campanha = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": empresa,
                      "nome": "Campanha de Teste",
                      "mensagem": "Mensagem de teste",
                      "canal": "whatsapp"
                  }
              )
              assert campanha.status_code == 200, campanha.text

              campanhas = client.get(
                  "/campanhas/",
                  params={"empresa_id": empresa}
              )
              assert campanhas.status_code == 200
              assert len(campanhas.json()) == 1

              print("BANCO DE DADOS: OK")
              print("CADASTRO DE CONTATO: OK")
              print("CONSULTA DE CONTATOS: OK")
              print("CRIACAO DE CAMPANHA: OK")
              print("CONSULTA DE CAMPANHAS: OK")
              print("S.I.M.A.: TESTE FUNCIONAL APROVADO")
          '
