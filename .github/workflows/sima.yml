
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Diagnosticar arquivos
        run: |
          python -c "
          import os
          import sys
          import app
          print('PYTHON:', sys.version)
          print('APP:', app.__file__)
          print('CONTENT MODELS EXISTE:', os.path.isfile('app/content_models.py'))
          "

      - name: Testar campanhas, conteúdo e histórico
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              empresa = "teste-sima-multimidia"

              contato = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato Autorizado",
                      "telefone": "5599111111111",
                      "canal": "whatsapp",
                      "empresa_id": empresa
                  }
              )
              assert contato.status_code == 200, contato.text
              contato_id = contato.json()["id"]

              autorizacao = client.post(
                  f"/contatos/{contato_id}/consentimento",
                  json={
                      "empresa_id": empresa,
                      "origem": "Teste ficticio"
                  }
              )
              assert autorizacao.status_code == 200, autorizacao.text

              campanha_texto = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": empresa,
                      "nome": "Campanha de Texto",
                      "mensagem": "Teste de mensagem do SIMA",
                      "canal": "whatsapp"
                  }
              )
              assert campanha_texto.status_code == 200, campanha_texto.text

              texto = campanha_texto.json()
              assert texto["tipo_conteudo"] == "text"
              assert texto["texto"] == "Teste de mensagem do SIMA"
              assert texto["envios_automaticos"] is False

              print("CAMPANHA DE TEXTO: OK")

              campanha_imagem = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": empresa,
                      "nome": "Campanha com Imagem",
                      "mensagem": "",
                      "canal": "whatsapp",
                      "tipo_conteudo": "image",
                      "media_url": "https://exemplo.com/imagem-teste.jpg",
                      "media_type": "image/jpeg",
                      "legenda": "Conheça nossa oferta!"
                  }
              )
              assert campanha_imagem.status_code == 200, campanha_imagem.text

              imagem = campanha_imagem.json()
              assert imagem["tipo_conteudo"] == "image"
              assert imagem["media_url"] == "https://exemplo.com/imagem-teste.jpg"
              assert imagem["media_type"] == "image/jpeg"
              assert imagem["texto"] == "Conheça nossa oferta!"
              assert imagem["envios_automaticos"] is False

              print("CAMPANHA COM IMAGEM: OK")
              print("LEGENDA DA IMAGEM: OK")

              listagem = client.get(
                  "/campanhas/",
                  params={"empresa_id": empresa}
              )
              assert listagem.status_code == 200, listagem.text

              campanhas = listagem.json()
              assert len(campanhas) == 2

              assert any(
                  c["tipo_conteudo"] == "text"
                  for c in campanhas
              )

              assert any(
                  c["tipo_conteudo"] == "image"
                  and c["texto"] == "Conheça nossa oferta!"
                  for c in campanhas
              )

              print("LISTAGEM DE CAMPANHAS: OK")

              campanha_id = texto["id"]

              preparacao = client.post(
                  f"/campanhas/{campanha_id}/preparar",
                  params={"empresa_id": empresa}
              )
              assert preparacao.status_code == 200, preparacao.text
              assert preparacao.json()["novos_registros"] == 1

              historico = client.get(
                  f"/campanhas/{campanha_id}/historico",
                  params={"empresa_id": empresa}
              )
              assert historico.status_code == 200, historico.text

              dados = historico.json()
              assert dados["total_registros"] == 1
              assert dados["historico"][0]["contato"] == "Contato Autorizado"
              assert dados["historico"][0]["status"] == "pending"
              assert dados["envios_automaticos"] is False

              print("CONTATO AUTORIZADO: OK")
              print("PREPARACAO DA CAMPANHA: OK")
              print("HISTORICO: OK")
              print("ENVIO AUTOMATICO: DESATIVADO")
              print("S.I.M.A.: TESTES APROVADOS")
          PY
