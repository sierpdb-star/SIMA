
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar banco e APIs
        run: |
          python -c '
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import engine
          from sqlalchemy import inspect

          with TestClient(app) as client:
              tabelas = set(inspect(engine).get_table_names())
              assert {"contacts", "campaigns", "delivery_logs"}.issubset(tabelas)

              empresa = "teste-sima"

              contato = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato de Teste",
                      "telefone": "5599999999999",
                      "canal": "whatsapp",
                      "empresa_id": empresa
                  }
              )
              assert contato.status_code == 200, contato.text

              contato_id = contato.json()["id"]
              assert contato.json()["consentimento"] == "pending"
              print("CADASTRO SEM CONSENTIMENTO: OK")

              autorizacao = client.post(
                  f"/contatos/{contato_id}/consentimento",
                  json={
                      "empresa_id": empresa,
                      "origem": "Formulario de autorizacao de teste"
                  }
              )
              assert autorizacao.status_code == 200, autorizacao.text
              assert autorizacao.json()["consentimento"] == "granted"
              print("REGISTRO DE CONSENTIMENTO: OK")

              descadastro = client.post(
                  f"/contatos/{contato_id}/descadastro",
                  params={"empresa_id": empresa}
              )
              assert descadastro.status_code == 200, descadastro.text
              assert descadastro.json()["consentimento"] == "revoked"
              print("DESCADASTRO: OK")

              consulta = client.get(
                  "/contatos/",
                  params={"empresa_id": empresa}
              )
              assert consulta.status_code == 200
              assert consulta.json()[0]["consentimento"] == "revoked"
              print("CONSULTA DO STATUS: OK")

              print("S.I.M.A.: TESTE DE PROTECAO APROVADO")
          '
