
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar protecao de campanhas
        run: |
          python -c '
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              empresa = "teste-etapa-24"

              def cadastrar(nome, telefone):
                  resposta = client.post(
                      "/contatos/",
                      params={
                          "nome": nome,
                          "telefone": telefone,
                          "canal": "whatsapp",
                          "empresa_id": empresa
                      }
                  )
                  assert resposta.status_code == 200, resposta.text
                  return resposta.json()["id"]

              autorizado = cadastrar("Autorizado", "5599111111111")
              pendente = cadastrar("Pendente", "5599222222222")
              descadastrado = cadastrar("Descadastrado", "5599333333333")

              for contato_id in [autorizado, descadastrado]:
                  resposta = client.post(
                      f"/contatos/{contato_id}/consentimento",
                      json={
                          "empresa_id": empresa,
                          "origem": "Autorizacao ficticia de teste"
                      }
                  )
                  assert resposta.status_code == 200, resposta.text

              resposta = client.post(
                  f"/contatos/{descadastrado}/descadastro",
                  params={"empresa_id": empresa}
              )
              assert resposta.status_code == 200, resposta.text

              campanha = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": empresa,
                      "nome": "Campanha de Protecao",
                      "mensagem": "Mensagem ficticia",
                      "canal": "whatsapp"
                  }
              )
              assert campanha.status_code == 200, campanha.text
              campanha_id = campanha.json()["id"]

              resposta = client.get(
                  f"/campanhas/{campanha_id}/destinatarios",
                  params={"empresa_id": empresa}
              )
              assert resposta.status_code == 200, resposta.text

              dados = resposta.json()
              ids = [c["id"] for c in dados["destinatarios"]]

              assert dados["total_autorizados"] == 1, dados
              assert ids == [autorizado], dados
              assert pendente not in ids
              assert descadastrado not in ids
              assert dados["envios_automaticos"] is False

              print("CONTATO AUTORIZADO: INCLUIDO")
              print("CONTATO PENDENTE: BLOQUEADO")
              print("CONTATO DESCADASTRADO: BLOQUEADO")
              print("CAMPANHA: SEM ENVIO AUTOMATICO")
              print("S.I.M.A.: PROTECAO APROVADA")
          '
