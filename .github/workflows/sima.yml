
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Diagnosticar arquivos
        run: |
          python -c "
          import os
          import sys
          import app
          print('PYTHON:', sys.version)
          print('APP:', app.__file__)
          print('CONTENT MODELS EXISTE:', os.path.isfile('app/content_models.py'))
          "

      
      
      - name: Testar campanhas, conteúdo, histórico e upload
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              empresa = "teste-sima-multimidia"

              # 1. CADASTRAR CONTATO
              contato = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato Autorizado",
                      "telefone": "5599111111111",
                      "canal": "whatsapp",
                      "empresa_id": empresa
                  }
              )

              assert contato.status_code in (200, 201), contato.text
              print("CONTATO: OK")

              # 2. CRIAR CAMPANHA DE TEXTO
              campanha_texto = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": empresa,
                      "nome": "Campanha de Texto",
                      "mensagem": "Teste do SIMA",
                      "canal": "whatsapp",
                      "tipo_conteudo": "text"
                  }
              )

              assert campanha_texto.status_code in (200, 201), campanha_texto.text
              id_campanha = campanha_texto.json()["id"]
              print("CAMPANHA DE TEXTO: OK")

              # 3. CRIAR CAMPANHA COM IMAGEM
              campanha_imagem = client.post(
                  "/campanhas/",
                  json={
                      "empresa_id": empresa,
                      "nome": "Campanha com Imagem",
                      "mensagem": "",
                      "canal": "whatsapp",
                      "tipo_conteudo": "image",
                      "media_url": "https://exemplo.com/imagem.png",
                      "media_type": "image/png",
                      "legenda": "Imagem de teste"
                  }
              )

              assert campanha_imagem.status_code in (200, 201), campanha_imagem.text
              print("CAMPANHA COM IMAGEM: OK")

              # 4. LISTAR CAMPANHAS
              listagem = client.get(
                  "/campanhas/",
                  params={"empresa_id": empresa}
              )

              assert listagem.status_code == 200, listagem.text
              print("LISTAGEM DE CAMPANHAS: OK")

              # 5. LISTAR DESTINATÁRIOS AUTORIZADOS
              destinatarios = client.get(
                  f"/campanhas/{id_campanha}/destinatarios",
                  params={"empresa_id": empresa}
              )

              assert destinatarios.status_code == 200, destinatarios.text
              print("DESTINATÁRIOS AUTORIZADOS: OK")

              # 6. PREPARAR DESTINATÁRIOS
              preparacao = client.post(
                  f"/campanhas/{id_campanha}/preparar",
                  params={"empresa_id": empresa}
              )

              assert preparacao.status_code == 200, preparacao.text
              print("PREPARAÇÃO DE DESTINATÁRIOS: OK")

              # 7. CONSULTAR HISTÓRICO
              historico = client.get(
                  f"/campanhas/{id_campanha}/historico",
                  params={"empresa_id": empresa}
              )

              assert historico.status_code == 200, historico.text
              print("HISTÓRICO: OK")

              # 8. TESTAR UPLOAD DE IMAGEM
              imagem_teste = b"\x89PNG\r\n\x1a\n"

              upload = client.post(
                  "/arquivos/imagem",
                  files={
                      "arquivo": (
                          "teste.png",
                          imagem_teste,
                          "image/png"
                      )
                  }
              )

              assert upload.status_code == 200, upload.text

              resultado_upload = upload.json()

              assert resultado_upload["media_type"] == "image/png"
              assert resultado_upload["envios_automaticos"] is False
              print("UPLOAD DE IMAGEM: OK")

              # 9. VERIFICAR ARQUIVO DISPONIBILIZADO
              imagem_salva = client.get(
                  resultado_upload["media_url"]
              )

              assert imagem_salva.status_code == 200, imagem_salva.text
              print("ARQUIVO DISPONIBILIZADO: OK")

              # 10. CONFIRMAR ENVIO AUTOMÁTICO DESATIVADO
              status = client.get("/status")

              assert status.status_code == 200, status.text
              assert status.json()["envios_automaticos"] is False

              print("ENVIO AUTOMÁTICO: DESATIVADO")
              print("S.I.M.A.: TODOS OS TESTES APROVADOS")
          PY
