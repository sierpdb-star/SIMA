
name: Teste do S.I.M.A.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar banco e APIs
        run: |
          python -c '
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:

              # Teste inicial
              resposta = client.get("/")
              assert resposta.status_code == 200

              # Contato autorizado com origem informada
              autorizado = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato Autorizado",
                      "telefone": "73999990001",
                      "canal": "whatsapp",
                      "empresa_id": "empresa_teste",
                      "consentimento": True,
                      "origem_consentimento": "Formulario de teste"
                  }
              )

              assert autorizado.status_code == 200
              assert autorizado.json()["consentimento"] == "granted"
              autorizado_id = autorizado.json()["id"]

              # Contato sem consentimento
              pendente = client.post(
                  "/contatos/",
                  params={
                      "nome": "Contato Pendente",
                      "telefone": "73999990002",
                      "canal": "whatsapp",
                      "empresa_id": "empresa_teste",
                      "consentimento": False
                  }
              )

              assert pendente.status_code == 200
              assert pendente.json()["consentimento"] == "pending"
              pendente_id = pendente.json()["id"]

              # Descadastrar contato autorizado
              descadastro = client.post(
                  f"/contatos/{autorizado_id}/descadastrar",
                  params={"empresa_id": "empresa_teste"}
              )

              assert descadastro.status_code == 200
              assert descadastro.json()["consentimento"] == "revoked"

              # Confirmar que o descadastro foi persistido
              consulta = client.get(
                  "/contatos/",
                  params={"empresa_id": "empresa_teste"}
              )

              assert consulta.status_code == 200

              contatos = {
                  c["id"]: c
                  for c in consulta.json()
              }

              assert contatos[autorizado_id]["consentimento"] == "revoked"
              assert contatos[pendente_id]["consentimento"] == "pending"

              # Descadastro de contato inexistente
              inexistente = client.post(
                  "/contatos/999999/descadastrar",
                  params={"empresa_id": "empresa_teste"}
              )

              assert inexistente.status_code == 404

              print("API INICIAL: OK")
              print("CONSENTIMENTO AUTORIZADO: OK")
              print("CONTATO PENDENTE: OK")
              print("DESCADASTRAMENTO: OK")
              print("PERSISTENCIA DO DESCADASTRO: OK")
              print("CONTATO INEXISTENTE: OK")
              print("S.I.M.A.: TESTES DE PROTECAO APROVADOS")
          '
